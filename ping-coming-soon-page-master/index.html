<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frontend Mentor | Ping coming soon page</title>
    <style>
      .attribution {
        font-size: 0.6875rem;
        text-align: center;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
      }
    </style>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
  </head>
  <body>
    <main class="container">
      <img class="logo" src="./images/logo.svg" alt="logo" />

      <header class="hero-section">
        <h1>We are launching <span class="bold">soon!</span></h1>
        <p class="text">Subscribe and get notified Notify Me</p>
      </header>

      <form action="#" class="subscribe-form" method="post">
        <div class="input-group">
          <input
            type="email"
            id="email"
            placeholder="Your email address..."
            id="email"
            class="input-form"
          />
          <button type="submit">Notify Me</button>
        </div>
      </form>
      <div class="imagen">
        <img src="./images/illustration-dashboard.png" alt="imagen de fondo" />
      </div>
    </main>

    <footer class="attribution">
      &copy; Copyright Ping. All rights reserved. Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">Your Name Here</a>.
    </footer>
  </body>
</html>
